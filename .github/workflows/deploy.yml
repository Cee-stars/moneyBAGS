name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本に制限する。進行中のデプロイは落とさない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # output: "export" なので out/ に静的ファイルが書き出される
      - run: npm run build

      # 前提: リポジトリの Settings → Pages → Source が「GitHub Actions」に
      # なっていること。なっていないとこのステップが Not Found で失敗する。
      # enablement: true での自動有効化は試したが、ワークフローの標準トークンには
      # Pages サイトの作成権限がなく "Resource not accessible by integration" で
      # 失敗する。この1回だけは人が設定する必要がある。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
